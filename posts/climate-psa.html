In this video, I discuss the impacts of Infrasound exposure, and it's potential correlation with data centers. 

I made this video for a Climate Sociology class. The instructions were to make a short PSA video in a vertical 'tik-tok' style format, exploring a subject of ecological impact people may not be aware of.
